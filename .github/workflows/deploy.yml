name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Run Deploy Script on Hetzner
        run: |
          ssh -o StrictHostKeyChecking=no deployuser@YOUR_SERVER_IP 'bash -s' < '~/portfolio/deploy.sh'